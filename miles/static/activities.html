<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miles · Activities</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>">
  <link rel="stylesheet" href="/theme.css">
  <style>
    .activities-view h1 {
      font-size: 1.25rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }
    .activities-view .subtitle { font-size: 0.8125rem; color: var(--muted); margin-bottom: 1.25rem; }
    .activities-view .activities-empty { font-size: 0.8125rem; color: var(--muted); padding: 1rem 0; }
    .activities-view .dense tbody td { padding: 0.25rem 0.75rem; font-size: 0.75rem; }
    .activities-view .dense thead th { padding: 0.375rem 0.75rem; font-size: 0.625rem; }
    .activities-view .entity-link { color: inherit; text-decoration: none; }
    .activities-view .entity-link:hover { text-decoration: underline; }
    .activities-view .run-type { font-size: 0.6875rem; color: var(--muted); text-transform: capitalize; }

    /* Phones: each row is a card (name + type, then the figures on one
       wrapped line), the whole card tapping through to the activity. The
       table layout returns at 640px. */
    .activities-view .act-table thead { display: none; }
    .activities-view .act-table, .activities-view .act-table tbody { display: block; }
    .activities-view .act-table tr {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.125rem 0.625rem;
      padding: 0.625rem 0.875rem;
      border-bottom: 1px solid var(--gridline);
    }
    .activities-view .act-table tr:last-child { border-bottom: none; }
    .activities-view .act-table tbody td {
      padding: 0;
      border: none;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: left;
    }
    .activities-view .act-table td.act-name {
      flex: 1 1 0;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
    }
    .activities-view .act-table td.act-type { order: 1; }
    /* Line break between the name row and the figures row. */
    .activities-view .act-table tr::before { content: ""; order: 2; flex-basis: 100%; }
    .activities-view .act-table td.act-date, .activities-view .act-table td.act-fig { order: 3; }
    .activities-view .act-table tbody td.dash { display: none; }
    .activities-view .act-table .entity-link::after { content: ""; position: absolute; inset: 0; }
    @media (min-width: 640px) {
      .activities-view .act-table { display: table; }
      .activities-view .act-table tbody { display: table-row-group; }
      .activities-view .act-table thead { display: table-header-group; }
      .activities-view .act-table tr { position: static; display: table-row; padding: 0; border: none; }
      .activities-view .act-table tr::before { content: none; }
      .activities-view .act-table .act-unit { display: none; }
      .activities-view .act-table tbody td {
        display: table-cell;
        padding: 0.25rem 0.75rem;
        border-bottom: 1px solid var(--gridline);
        color: var(--text-secondary);
      }
      .activities-view .act-table tbody td.act-name { overflow: visible; font-size: 0.75rem; font-weight: 400; color: var(--text-secondary); }
      .activities-view .act-table tbody td.r { text-align: right; }
      .activities-view .act-table tbody td.dash { display: table-cell; text-align: right; color: var(--baseline); }
      .activities-view .act-table tbody tr:last-child td { border-bottom: none; }
      .activities-view .act-table .entity-link::after { content: none; }
    }

    .activities-view .load-more-row { text-align: center; padding: 1rem 0; }
    .activities-view .load-more-btn {
      font-size: 0.8125rem;
      font-weight: 600;
      width: 100%;
      min-height: 2.75rem;
      padding: 0.5rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }
    .activities-view .load-more-btn:hover { background: var(--pr-bg-hover); }
    .activities-view .load-more-btn:disabled { opacity: 0.5; cursor: default; }
    @media (min-width: 640px) {
      .activities-view .load-more-btn { width: auto; min-height: 0; font-size: 0.75rem; }
    }
  </style>
</head>
<body>
<script src="/nav.js"></script>
<script src="/charts.js"></script>

<main class="activities-view">
  <h1>Activities</h1>
  <p class="subtitle" id="subtitle">Loading…</p>

  <div id="section-activities" style="display:none">
    <div class="scroll dense">
      <table class="act-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Type</th>
            <th class="r">Distance</th>
            <th class="r">Time</th>
            <th class="r">Pace</th>
            <th class="r">Avg HR</th>
          </tr>
        </thead>
        <tbody id="body-activities"></tbody>
      </table>
    </div>
    <div class="load-more-row">
      <button class="load-more-btn" id="load-more">Load more</button>
    </div>
  </div>

  <p class="activities-empty" id="empty" style="display:none">No activities synced yet.</p>
</main>

<script>
  const PAGE_SIZE = 50;
  let offset = 0;
  let loading = false;

  function td(val, cls = 'r') {
    if (val == null) return `<td class="dash">—</td>`;
    return `<td class="${cls}">${val}</td>`;
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g,
      ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  function renderRows(rows) {
    const body = document.getElementById('body-activities');
    body.insertAdjacentHTML('beforeend', rows.map(r => `
      <tr>
        <td class="act-date">${esc(r.start_date ? r.start_date.slice(0, 10) : '—')}</td>
        <td class="act-name"><a class="entity-link" href="/activity.html?id=${r.id}">${esc(r.name ?? 'Untitled')}</a></td>
        <td class="act-type"><span class="run-type">${esc(r.run_type)}</span></td>
        ${td(r.distance_mi != null ? `${r.distance_mi.toFixed(2)} mi` : null, 'r act-fig')}
        ${td(fmt.time(r.moving_time_s), 'r act-fig')}
        ${td(r.pace_min_per_mile != null ? `${fmt.pace(r.pace_min_per_mile)}/mi` : null, 'r act-fig')}
        ${td(r.avg_hr != null ? `${r.avg_hr}<span class="act-unit"> bpm</span>` : null, 'r act-fig')}
      </tr>
    `).join(''));
  }

  async function loadPage() {
    if (loading) return;
    loading = true;
    const btn = document.getElementById('load-more');
    btn.disabled = true;
    btn.textContent = 'Loading…';

    const res = await fetch(`/api/activities-list?offset=${offset}&limit=${PAGE_SIZE}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const page = await res.json();

    renderRows(page.rows);
    offset += page.rows.length;

    btn.disabled = false;
    btn.textContent = 'Load more';
    btn.style.display = page.has_more ? '' : 'none';
    loading = false;
    return page;
  }

  loadPage().then(page => {
    if (!page.rows.length) {
      document.getElementById('subtitle').textContent = 'No activities synced yet.';
      document.getElementById('empty').style.display = '';
      return;
    }
    document.getElementById('subtitle').textContent = 'All synced runs, newest first.';
    document.getElementById('section-activities').style.display = '';
    document.getElementById('load-more').addEventListener('click', loadPage);
  }).catch(err => {
    document.getElementById('subtitle').textContent = `Error: ${err.message}`;
  });
</script>
</body>
</html>
