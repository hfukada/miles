<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miles · Route</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
  <style>
    .route-view .subtitle { margin-bottom: 0.25rem; }
    .route-view .location { font-size: 0.8125rem; color: var(--text-secondary); margin-bottom: 0.75rem; min-height: 1.1rem; }
    .route-view .location .skeleton { display: inline-block; width: 10rem; height: 0.8rem; vertical-align: -1px; }
    .route-view .route-notes { font-size: 0.8125rem; color: var(--text-secondary); margin-bottom: 1rem; white-space: pre-wrap; }
    .route-view .note { font-size: 0.75rem; color: var(--muted); font-style: italic; margin-bottom: 1rem; }
    .route-view .note button {
      font: inherit; font-style: normal; margin-left: 0.5rem; padding: 0.1875rem 0.625rem;
      color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
    }
    .route-view .note button:disabled { color: var(--muted); cursor: default; }
    .route-view .note .error { display: inline; padding: 0; margin-left: 0.5rem; font-style: normal; color: var(--series-6); }

    .route-view #map-route { height: 380px; border-radius: 6px; }
    .route-view #chart-elevation { height: 180px; }
    .route-view #gap-body { min-height: 9rem; }
    .route-view .stat .skeleton { height: 1.1rem; width: 2.75rem; margin-top: 0.125rem; }
    </style>
</head>
<body>
<script src="/nav.js"></script>
<script src="/charts.js"></script>
<script src="/map.js"></script>

<main class="route-view page-view">
  <div id="root">Loading…</div>
</main>

<script>
  const params = new URLSearchParams(location.search);
  const routeId = params.get('id');
  const root = document.getElementById('root');
  let routeMap = null;
  let routeLayer = null;
  let elevChart = null;
  let showId = 0;
  let state = null;

  async function main() {
    if (!routeId) {
      root.innerHTML = '<div class="error">No route id given. Use route.html?id=&lt;route_id&gt;.</div>';
      return;
    }
    const profileP = getJson(`/api/routes/${routeId}/profile`);
    const routeRes = await getJson(`/api/routes/${routeId}`);
    if (routeRes.error) {
      root.innerHTML = `<div class="error">${esc(routeRes.error === 'HTTP 404' || /^No route/.test(routeRes.error) ? 'Route not found.' : 'Failed to load route.')}</div>`;
      return;
    }
    show(routeRes.data, profileP);
  }

  // Draws the header and a skeleton for every panel at once, then fills each
  // panel as its own request arrives.
  function show(route, profileP = getJson(`/api/routes/${route.route_id}/profile`)) {
    const id = ++showId;
    const live = () => id === showId;
    const hasElevation = !!route.has_elevation;
    state = { route, profile: null, points: null, pointsError: null };
    if (routeMap) { routeMap.remove(); routeMap = null; routeLayer = null; }
    if (elevChart) { elevChart.dispose(); elevChart = null; }

    const distMi = route.distance_m != null ? (route.distance_m / MILE_METERS).toFixed(2) : '—';
    const gainFt = route.gain_m != null ? Math.round(route.gain_m * FT_PER_METER) : null;
    const lossFt = route.loss_m != null ? Math.round(route.loss_m * FT_PER_METER) : null;
    const skeletonTile = (label) => `<div class="stat" data-pending><div class="stat-label">${label}</div><div class="skeleton"></div></div>`;

    root.innerHTML = `
      <h1>${esc(route.name ?? route.gpx_name ?? 'Untitled route')}</h1>
      <div class="subtitle">${distMi} mi${route.shape ? ` · ${esc(route.shape.replace(/_/g, ' '))}` : ''}${route.source ? ` · ${esc(route.source)}` : ''}</div>
      <div class="location" id="location"><span class="skeleton"></span></div>
      ${route.notes ? `<div class="route-notes">${esc(route.notes)}</div>` : ''}
      <div class="note" id="elev-note" ${hasElevation ? 'hidden' : ''}></div>
      <div class="stat-strip" id="stat-strip">
        ${statTile('Gain', gainFt != null ? gainFt : '—', 'ft')}
        ${statTile('Loss', lossFt != null ? lossFt : '—', 'ft')}
        ${hasElevation ? ['Run', 'Grind', 'Hike', 'Longest Hike', 'Steep Descent'].map(skeletonTile).join('') : ''}
      </div>
      <div class="chart-panel">
        <div class="chart-panel-title">Route</div>
        <div id="map-route" class="skeleton"></div>
        ${hasElevation ? '<div class="legend" id="legend"><span class="skeleton"></span></div>' : ''}
      </div>
      <div class="chart-panel">
        <div class="chart-panel-title">Elevation</div>
        <div id="chart-elevation" class="skeleton"></div>
      </div>
      ${hasElevation ? `
        <div class="chart-panel" id="gap-panel">
          <div class="chart-panel-title">Course gap analysis</div>
          <div id="gap-body" class="skeleton"></div>
        </div>` : ''}
    `;
    renderElevationNote(route);

    getJson(`/api/routes/${route.route_id}/location`).then(res => {
      if (!live()) return;
      const text = res.data?.location ?? route.location;
      const el = document.getElementById('location');
      if (text) el.textContent = text;
      else el.remove();
    });

    profileP.then(res => {
      if (!live()) return;
      if (res.error) {
        panelError('map-route', `Could not load the route line: ${res.error}`);
        panelError('chart-elevation', `Could not load the elevation profile: ${res.error}`);
        return;
      }
      state.profile = res.data;
      drawMap();
      drawElevation();
    });

    if (!hasElevation) return;

    getJson(`/api/terrain/routes/${route.route_id}/points`).then(res => {
      if (!live()) return;
      if (res.error) {
        state.pointsError = res.error;
      } else {
        state.points = new Map(res.data.map(p => [p.idx, p.cls]));
      }
      renderLegend();
      drawMap();
      drawElevation();
    });

    getJson(`/api/terrain/routes/${route.route_id}`).then(res => {
      if (!live()) return;
      renderScore(res);
    });
  }

  function panelError(id, message) {
    const el = document.getElementById(id);
    el.classList.remove('skeleton');
    el.style.height = 'auto';
    el.innerHTML = `<div class="error">${esc(message)}</div>`;
  }

  // A route whose elevation tiles are not cached yet can fetch them on
  // request; a route whose file simply has none cannot.
  function renderElevationNote(route) {
    const note = document.getElementById('elev-note');
    if (route.has_elevation) return;
    if (!route.elevation_pending) {
      note.textContent = 'No elevation data for this route — runnability coloring is unavailable.';
      return;
    }
    note.innerHTML = 'Elevation for this route has not been fetched yet — runnability coloring needs it. <button type="button">Fetch elevation</button><span id="redrape-error"></span>';
    const button = note.querySelector('button');
    button.addEventListener('click', async () => {
      button.disabled = true;
      button.textContent = 'Fetching elevation…';
      document.getElementById('redrape-error').innerHTML = '';
      try {
        const res = await fetch(`/api/routes/${route.route_id}/redrape`, { method: 'POST' });
        if (!res.ok) throw new Error(await failure(res));
        show(await res.json());
      } catch (e) {
        button.disabled = false;
        button.textContent = 'Fetch elevation';
        document.getElementById('redrape-error').innerHTML = `<span class="error">${esc(e.message || 'Could not fetch elevation.')}</span>`;
      }
    });
  }

  function renderLegend() {
    const legend = document.getElementById('legend');
    if (!legend) return;
    legend.innerHTML = state.points
      ? classLegendHtml(chartTheme())
      : `<span>Runnability colors unavailable: ${esc(state.pointsError)}</span>`;
  }

  function renderScore(res) {
    const strip = document.getElementById('stat-strip');
    strip.querySelectorAll('[data-pending]').forEach(el => el.remove());
    const score = res.data;
    if (res.error || !score?.runnability) {
      if (res.error) strip.insertAdjacentHTML('beforeend', statTile('Runnability', '—', '', `Unavailable: ${esc(res.error)}`));
    } else {
      const r = score.runnability;
      strip.insertAdjacentHTML('beforeend', [
        statTile('Run', r.run_pct.toFixed(0), '%'),
        statTile('Grind', r.grind_pct.toFixed(0), '%'),
        statTile('Hike', r.hike_pct.toFixed(0), '%'),
        statTile('Longest Hike', (r.longest_hike_m / MILE_METERS).toFixed(2), 'mi'),
        statTile('Steep Descent', (r.steep_descent_m / MILE_METERS).toFixed(2), 'mi'),
      ].join(''));
    }
    if (res.error) panelError('gap-body', `Could not load the gap analysis: ${res.error}`);
    else if (score?.gap_analysis) renderGapAnalysis(score.gap_analysis);
    else document.getElementById('gap-panel').remove();
  }

  // The profile with each point's terrain class (null until the classes arrive).
  function classedProfile() {
    return state.profile.map(p => ({ ...p, cls: state.points?.get(p.idx) ?? null }));
  }

  function drawMap() {
    if (!state.profile?.length) return;
    const el = document.getElementById('map-route');
    if (typeof L === 'undefined') {
      panelError('map-route', 'The map library did not load.');
      return;
    }
    const theme = chartTheme();
    const first = !routeMap;
    if (first) {
      el.classList.remove('skeleton');
      routeMap = L.map('map-route', { scrollWheelZoom: false });
      addBaseLayer(routeMap, { withTerrainData: true });
      routeLayer = L.layerGroup().addTo(routeMap);
    }
    routeLayer.clearLayers();

    const allLatLngs = drawClassedRoute(routeLayer, classedProfile(), theme);
    if (!allLatLngs.length) return;

    if (first) routeMap.fitBounds(L.latLngBounds(allLatLngs), { padding: [16, 16] });
  }

  function drawElevation() {
    const profilePoints = state.profile;
    if (!profilePoints) return;
    const el = document.getElementById('chart-elevation');
    if (profilePoints.filter(p => p.ele_m != null).length < 2) {
      panelError('chart-elevation', 'No elevation profile available.');
      return;
    }
    el.classList.remove('skeleton');
    if (!elevChart) {
      elevChart = echarts.init(el);
      linkChartToMap(elevChart, () => routeMap, classedProfile);
    }
    elevChart.setOption(classedElevationOption(chartTheme(), classedProfile()), true);
  }

  function renderGapAnalysis(gap) {
    const rows = gap.bins.map(b => `
      <tr>
        <td>${gradeBinLabel(b)}</td>
        <td class="r">${(b.course_share * 100).toFixed(1)}%</td>
        <td class="r">${b.deficit != null ? `${(b.deficit * 100).toFixed(0)}%` : '—'}</td>
        <td class="r">${b.weighted_deficit != null ? `${(b.weighted_deficit * 100).toFixed(1)}%` : '—'}</td>
      </tr>
    `).join('');
    const body = document.getElementById('gap-body');
    body.classList.remove('skeleton');
    body.innerHTML = `
      <div class="desc" style="margin-bottom:0.5rem">
        This course's grade histogram weighted by the athlete's own per-bin efficiency deficit — the grades most worth practicing.
      </div>
      <div class="scroll dense">
        <table>
          <thead>
            <tr>
              <th>Grade</th>
              <th class="r">Share of course</th>
              <th class="r">Deficit</th>
              <th class="r">Weighted deficit</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  window.addEventListener('resize', () => {
    elevChart?.resize();
    routeMap?.invalidateSize();
  });

  main();
</script>
</body>
</html>
