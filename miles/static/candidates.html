<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miles · Route options</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
</head>
<body>
<script src="/nav.js"></script>
<script src="/charts.js"></script>
<script src="/map.js"></script>
<script src="/candidate-cards.js"></script>

<main class="cand-view page-view">
  <div id="root"><div class="loading">Loading…</div></div>
</main>

<script>
  const setId = new URLSearchParams(location.search).get('set');
  const root = document.getElementById('root');

  async function main() {
    if (!setId) {
      root.innerHTML = '<div class="error">No set given. Use candidates.html?set=&lt;set_id&gt;.</div>';
      return;
    }
    const res = await getJson(`/api/candidate-sets/${encodeURIComponent(setId)}`);
    if (res.error) {
      root.innerHTML = `<div class="error">${esc(res.error)}</div>`;
      return;
    }
    const set = res.data;
    document.title = `Miles · ${set.title}`;
    root.innerHTML = `
      <h1>${esc(set.title)}</h1>
      <div class="subtitle">Shared ${new Date(set.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}
        · ${set.candidates.length} option${set.candidates.length === 1 ? '' : 's'}</div>
      ${set.candidates.map(cardHtml).join('')}
    `;
    mountCards(root);
  }

  main();
</script>
</body>
</html>
