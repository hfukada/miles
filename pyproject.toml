[project]
name = "miles"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "stravalib>=2.0",
    "mcp[cli]>=1.0",
    "python-dotenv>=1.0",
    "click>=8.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "aiofiles>=23.0",
    "anyio>=4.0",
    "pandas>=2.2",
    "defusedxml>=0.7.1",
    "requests>=2.31",
    "pillow>=12.3.0",
    "osmium>=4.3.1",
    "prometheus-client>=0.26.0",
]

[project.scripts]
miles-sync = "miles.sync:main"
miles-auth = "miles.auth:main"
miles-mcp = "miles.mcp_server:main"
miles-api = "miles.api:main"
miles-derive = "miles.derive:main"
miles-route-import = "miles.route_import:main"
miles-area-import = "miles.area_import:main"
miles-area-refresh = "miles.area_refresh:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "playwright>=1.52",
    # Only to write legacy .parquet fixtures in tests/test_streams.py.
    "pyarrow>=17.0",
    "pyright>=1.1.411",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[tool.pyright]
include = ["miles"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
